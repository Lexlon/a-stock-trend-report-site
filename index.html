<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A股趋势股票日报</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Daily Stock Intelligence</p>
          <h1>A股趋势股票日报</h1>
        </div>
        <div class="status-pill" id="configStatus">加载中</div>
      </header>

      <main>
        <section class="hero">
          <div class="hero-copy">
            <p class="date" id="generatedAt">--</p>
            <h2 id="headline">正在读取今日数据</h2>
            <p id="marketTone">请稍候。</p>
            <div class="hero-actions">
              <a class="primary-link" href="./report-data.json">查看 JSON 数据</a>
              <span class="hint">每日任务运行后自动刷新</span>
            </div>
          </div>
          <div class="market-board" aria-label="market visual">
            <canvas id="heroChart" width="620" height="340"></canvas>
          </div>
        </section>

        <section class="metric-grid" id="metrics"></section>

        <section class="split">
          <article class="panel">
            <div class="section-head">
              <p class="eyebrow">Research Notes</p>
              <h3>机会与催化</h3>
            </div>
            <ul class="note-list" id="opportunities"></ul>
          </article>
          <article class="panel">
            <div class="section-head">
              <p class="eyebrow">Risk Control</p>
              <h3>风险与纪律</h3>
            </div>
            <ul class="note-list risk" id="risks"></ul>
          </article>
        </section>

        <section class="section-head stock-head">
          <div>
            <p class="eyebrow">Watchlist</p>
            <h3>趋势股票雷达</h3>
          </div>
          <p class="muted">每日由 Codex 扫描并更新趋势候选</p>
        </section>
        <section class="stock-grid" id="stockGrid"></section>

        <section class="panel timeline-panel">
          <div class="section-head">
            <p class="eyebrow">Action Checklist</p>
            <h3>今日观察清单</h3>
          </div>
          <div class="timeline" id="watchlist"></div>
        </section>
      </main>
    </div>
    <script src="./data.js?v=202605210127"></script>
    <script src="./app.js?v=202605210127"></script>
  </body>
</html>
